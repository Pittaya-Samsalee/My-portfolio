<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Pittaya Samsalee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-logo">PS</div>
    <ul class="nav-links">
      <li><a href="index.html" class="nav-link">HOME</a></li>
      <li><a href="projects.html" class="nav-link">EXPERIENCE</a></li>
      <li><a href="contact.html" class="nav-link">CONTACT</a></li>
      <li><a href="login.html" class="nav-link active" id="navAuthLink">LOGIN</a></li>
    </ul>
    <button class="hamburger" id="hamburger">&#9776;</button>
  </nav>

  <main>
    <section class="contact-section">
      <h1>Login</h1>

      <div class="form-container">
        <h2>Sign In</h2>

        <!-- Step 1: email + password -->
        <form id="loginForm">
          <div class="form-group">
            <label for="emailInput">EMAIL ADDRESS</label>
            <input type="email" id="emailInput" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label for="passwordInput">PASSWORD</label>
            <input type="password" id="passwordInput" placeholder="Your password" required>
          </div>
          <div id="loginError" style="color:#B00020; font-size:0.85rem; display:none;"></div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">LOG IN</button>
        </form>

        <!-- Step 2: MFA code (hidden until required) -->
        <form id="mfaForm" style="display:none; margin-top: 25px; border-top: 1px solid #EBF3F9; padding-top: 25px;">
          <div class="form-group">
            <label for="mfaCodeInput">6-DIGIT AUTHENTICATOR CODE</label>
            <input type="text" id="mfaCodeInput" placeholder="123456" inputmode="numeric" maxlength="6" required>
          </div>
          <div id="mfaError" style="color:#B00020; font-size:0.85rem; display:none;"></div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">VERIFY &amp; CONTINUE</button>
        </form>

        <p style="margin-top:20px; font-size:0.9rem;">No account yet? <a href="register.html">Register</a></p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <p>© 2026 Pittaya Samsalee. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
  <script src="nav-auth.js"></script>
  <script src="auth-forms.js"></script>
</body>
</html>
