    <section class="contact-section">
      <h1>Contact Me</h1>
      
      <div class="contact-info">
        <p><strong>Phone:</strong> +44 7403 983785</p>
        <p><strong>Email:</strong> Pittaya.jackky@gmail.com</p>
        <p><strong>Location:</strong> Basingstoke, United Kingdom</p>
      </div>

      <div class="form-container">
        <h2>Send a Message</h2>
        <form id="contactForm">
          <div class="form-group">
            <label for="nameInput">YOUR NAME</label>
            <input type="text" id="nameInput" placeholder="Enter your name">
          </div>
          <div class="form-group">
            <label for="emailInput">YOUR EMAIL ADDRESS</label>
            <input type="email" id="emailInput" placeholder="Enter your email address">
          </div>
          <div class="form-group">
            <label for="messageInput">YOUR MESSAGE</label>
            <textarea id="messageInput" placeholder="Write your message here..."></textarea>
          </div>
          <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%;">SUBMIT MESSAGE</button>
        </form>
      </div>
    </section>
